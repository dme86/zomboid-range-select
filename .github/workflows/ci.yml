name: Lua CI
on:
  push:
  pull_request:
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.3'
      - name: Syntax check
        run: find Contents -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Selection tests
        run: |
          lua tests/test_core.lua
          lua tests/test_client_mock.lua
          lua tests/test_runtime_probe.lua
      - name: Workshop package
        run: zip -r ZomboidRangeSelect.zip Contents workshop.txt -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: ZomboidRangeSelect
          path: ZomboidRangeSelect.zip
